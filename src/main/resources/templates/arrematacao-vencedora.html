<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parabéns! Você venceu um lote</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f6f7fb; margin: 0; padding: 24px;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0">
    <tr>
        <td align="center">
            <table role="presentation" width="620" cellspacing="0" cellpadding="0" style="background: #ffffff; border-radius: 12px; padding: 32px;">
                <tr>
                    <td style="font-size: 24px; font-weight: 700; color: #1f2937; padding-bottom: 16px;">
                        Parabéns! Você foi o ganhador
                    </td>
                </tr>
                <tr>
                    <td style="font-size: 16px; color: #374151; line-height: 1.6; padding-bottom: 12px;">
                        Olá, <strong>{{nome}}</strong>!
                    </td>
                </tr>
                <tr>
                    <td style="font-size: 16px; color: #374151; line-height: 1.6; padding-bottom: 12px;">
                        Seu lance foi o vencedor no leilão <strong>{{tituloLeilao}}</strong>.
                    </td>
                </tr>
                <tr>
                    <td style="font-size: 16px; color: #374151; line-height: 1.6; padding-bottom: 20px;">
                        Lote: <strong>{{codigoLote}}</strong><br/>
                        Bem: <strong>{{nomeBem}}</strong><br/>
                        Valor final: <strong>{{valorFinal}}</strong>
                    </td>
                </tr>
                <tr>
                    <td style="font-size: 14px; color: #6b7280; line-height: 1.5;">
                        Em breve, nossa equipe entrará em contato com as orientações dos próximos passos.
                    </td>
                </tr>
                <tr>
                    <td style="font-size: 12px; color: #9ca3af; padding-top: 24px;">
                        © {{ano}} {{empresa}}
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
